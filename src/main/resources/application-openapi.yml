spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/followme
    username: followme
    password: followme
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema:
    show-sql: false
  cloud:
    config:
      enabled: false
  config:
    import: ""
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

management:
  tracing:
    enabled: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true